name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Bundles the small English model so the app works offline right after install.
      # Filipino / Bisaya models are imported on the phone (Lang > Import voice model).
      - name: Fetch English offline model
        run: bash fetch-models.sh

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TermPrompter-apk
          path: app/build/outputs/apk/release/*.apk
